[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xr-headpose-forecasting"
version = "0.1.0"
description = "Efficient causal quaternion forecasting for XR head motion"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.8.4"]
ml = ["torch>=2.4,<3", "onnx>=1.17,<2", "onnxruntime>=1.20,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

